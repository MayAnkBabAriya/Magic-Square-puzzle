<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magic Square Puzzle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0f131a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    .game-card {
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      width: 100%;
      max-width: 345px;
    }

    .target-badge {
      width: 60px;
      height: 48px;
      background: #142e1d;
      border: 1.5px solid #22c55e;
      color: #22c55e;
      font-size: 22px;
      font-weight: 800;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.25);
    }

    .banner {
      width: 190px;
      padding: 8px 0;
      background: #1b3824;
      border: 1.5px solid #22c55e;
      color: #86efac;
      font-size: 16px;
      font-weight: 800;
      text-align: center;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .board-layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row-align {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-gap: 6px;
      background: #12161f;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cell {
      width: 56px;
      height: 56px;
      border: 1.5px solid #2d3748;
      border-radius: 10px;
      background: #252d3d;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      outline: none;
      caret-color: #22c55e;
      padding: 0;
      transition: all 0.15s ease;
    }

    .cell:focus {
      background: #2b3547;
      border-color: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
    }

    .sum-box {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 800;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      background: #252d3d;
      color: #718096;
      transition: all 0.2s ease;
    }

    .sum-box.matched {
      background: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.45);
    }

    .row-sums {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row-sums .sum-box {
      width: 54px;
      height: 56px;
    }

    .col-sums {
      display: flex;
      gap: 6px;
      margin-left: 6px;
    }
    .col-sums .sum-box {
      width: 56px;
      height: 50px;
    }

    .corner-diag {
      width: 54px;
      height: 50px;
    }

    /* Used/Pending numbers ribbon */
    .hint-container {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .hint-label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .num-palette {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .num-chip {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #252d3d;
      border: 1px solid #3b475d;
      color: #38bdf8;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .num-chip.used {
      background: transparent;
      border-color: transparent;
      color: #4b5563;
      text-decoration: line-through;
      pointer-events: none;
    }

    /* Buttons */
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
    }

    .btn-reset {
      background: #252d3d;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-reset:active {
      background: #2f394d;
    }

    .btn-auto {
      background: #16a34a;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
    }
    .btn-auto:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="target-badge" id="top-box">15</div>
    <div class="banner">Put 1 to 9</div>

    <div class="board-layout">
      <!-- 3x3 Grid and Row Totals -->
      <div class="row-align">
        <div class="grid" id="grid">
          <input class="cell" type="text" inputmode="numeric" id="c0">
          <input class="cell" type="text" inputmode="numeric" id="c1">
          <input class="cell" type="text" inputmode="numeric" id="c2">
          <input class="cell" type="text" inputmode="numeric" id="c3">
          <input class="cell" type="text" inputmode="numeric" id="c4">
          <input class="cell" type="text" inputmode="numeric" id="c5">
          <input class="cell" type="text" inputmode="numeric" id="c6">
          <input class="cell" type="text" inputmode="numeric" id="c7">
          <input class="cell" type="text" inputmode="numeric" id="c8">
        </div>

        <div class="row-sums">
          <div class="sum-box" id="row0">0</div>
          <div class="sum-box" id="row1">0</div>
          <div class="sum-box" id="row2">0</div>
        </div>
      </div>

      <!-- Column Totals and Diagonal Total -->
      <div class="row-align">
        <div class="col-sums">
          <div class="sum-box" id="col0">0</div>
          <div class="sum-box" id="col1">0</div>
          <div class="sum-box" id="col2">0</div>
        </div>
        <div class="sum-box corner-diag" id="diag0">0</div>
      </div>
    </div>

    <!-- Remaining Numbers Tracker -->
    <div class="hint-container">
      <div class="hint-label">Available Numbers (1-9):</div>
      <div class="num-palette">
        <div class="num-chip" data-num="1">1</div>
        <div class="num-chip" data-num="2">2</div>
        <div class="num-chip" data-num="3">3</div>
        <div class="num-chip" data-num="4">4</div>
        <div class="num-chip" data-num="5">5</div>
        <div class="num-chip" data-num="6">6</div>
        <div class="num-chip" data-num="7">7</div>
        <div class="num-chip" data-num="8">8</div>
        <div class="num-chip" data-num="9">9</div>
      </div>
    </div>

    <!-- Buttons -->
    <div class="controls">
      <button class="btn-reset" onclick="resetAll()">Reset All</button>
      <button class="btn-auto" onclick="autoSolve()">Auto 15</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const TARGET = 15;
    const cells = Array.from({ length: 9 }, (_, i) => document.getElementById(`c${i}`));
    const chips = Array.from(document.querySelectorAll('.num-chip'));
    let activeIdx = 0;

    cells.forEach((cell, idx) => {
      cell.addEventListener('focus', () => {
        activeIdx = idx;
        setTimeout(() => cell.select(), 10);
      });

      cell.addEventListener('input', (e) => {
        handleDigit(idx, e.target.value);
      });

      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value) {
          e.preventDefault();
          const prev = (idx - 1 + 9) % 9;
          cells[prev].focus();
          cells[prev].value = '';
          recalculate();
        }
      });
    });

    function handleDigit(idx, val) {
      const match = val.match(/[1-9]/g);
      if (!match || match.length === 0) {
        cells[idx].value = '';
        recalculate();
        return;
      }

      const digit = match[match.length - 1];

      // Auto-erase the number from any cell where it was already typed
      cells.forEach((otherCell, otherIdx) => {
        if (otherIdx !== idx && otherCell.value === digit) {
          otherCell.value = '';
        }
      });

      cells[idx].value = digit;
      recalculate();

      // Loop forward to next cell (wraps back to 1st cell on reaching the end)
      const nextIdx = (idx + 1) % 9;
      cells[nextIdx].focus();
      cells[nextIdx].select();
    }

    // Tapping a remaining number chip assigns it to current cell
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const num = chip.getAttribute('data-num');
        handleDigit(activeIdx, num);
      });
    });

    function getValues() {
      return cells.map(c => parseInt(c.value, 10) || 0);
    }

    function setBoxState(id, sum) {
      const el = document.getElementById(id);
      el.textContent = sum;
      if (sum === TARGET) {
        el.classList.add('matched');
      } else {
        el.classList.remove('matched');
      }
    }

    function recalculate() {
      const v = getValues();

      // Rows
      const r0 = v[0] + v[1] + v[2];
      const r1 = v[3] + v[4] + v[5];
      const r2 = v[6] + v[7] + v[8];
      setBoxState('row0', r0);
      setBoxState('row1', r1);
      setBoxState('row2', r2);

      // Columns
      const c0 = v[0] + v[3] + v[6];
      const c1 = v[1] + v[4] + v[7];
      const c2 = v[2] + v[5] + v[8];
      setBoxState('col0', c0);
      setBoxState('col1', c1);
      setBoxState('col2', c2);

      // Diagonals
      const d0 = v[0] + v[4] + v[8];
      const d1 = v[2] + v[4] + v[6];
      setBoxState('diag0', d0);

      // Update available numbers bar
      const usedSet = new Set(v.filter(n => n >= 1 && n <= 9));
      chips.forEach(chip => {
        const num = parseInt(chip.getAttribute('data-num'), 10);
        if (usedSet.has(num)) {
          chip.classList.add('used');
        } else {
          chip.classList.remove('used');
        }
      });

      // Strict win condition: exactly 9 unique digits and all 8 lines equal 15
      if (usedSet.size === 9 &&
          r0 === 15 && r1 === 15 && r2 === 15 &&
          c0 === 15 && c1 === 15 && c2 === 15 &&
          d0 === 15 && d1 === 15) {
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
        setTimeout(() => alert('🎉 Congratulations! You solved the 15 Magic Square!'), 80);
      }
    }

    function resetAll() {
      cells.forEach(c => c.value = '');
      recalculate();
      cells[0].focus();
    }

    function autoSolve() {
      const solution = [8, 1, 6, 3, 5, 7, 4, 9, 2];
      solution.forEach((val, i) => cells[i].value = val);
      recalculate();
    }

    recalculate();
  </script>
</body>
</html>
