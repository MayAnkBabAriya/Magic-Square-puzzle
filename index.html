<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Magic Square Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #1c1c1e;
      --card-bg: #2c2c2e;
      --text: #ffffff;
      --accent: #34c759;
      --cell-bg: #3a3a3c;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 16px;
    }
    h2 { margin: 8px 0; }
    .status { margin-bottom: 12px; font-size: 14px; opacity: 0.8; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-gap: 10px;
      margin-bottom: 20px;
    }
    .cell {
      width: 70px;
      height: 70px;
      background: var(--cell-bg);
      border: 2px solid #555;
      border-radius: 8px;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      outline: none;
    }
    .cell:focus { border-color: var(--accent); }
    .sums {
      display: flex;
      gap: 12px;
      font-size: 15px;
      margin-bottom: 16px;
    }
    .sum-indicator {
      padding: 6px 10px;
      border-radius: 6px;
      background: #444;
    }
    .sum-indicator.valid { background: var(--accent); color: #000; font-weight: bold; }
    .btn-container { display: flex; gap: 10px; }
    button {
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #007aff;
      color: white;
    }
    button.secondary { background: #555; }
  </style>
</head>
<body>
  <h2>Magic Square (3x3)</h2>
  <div class="status">Fill numbers 1 to 9. Every row, col & diag must equal 15.</div>

  <div class="grid" id="grid"></div>

  <div class="sums" id="status-bar">
    <div id="row-status" class="sum-indicator">Rows: 0/3</div>
    <div id="col-status" class="sum-indicator">Cols: 0/3</div>
    <div id="diag-status" class="sum-indicator">Diags: 0/2</div>
  </div>

  <div class="btn-container">
    <button class="secondary" onclick="resetBoard()">Reset</button>
    <button onclick="autoSolve()">Auto Solve</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const N = 3;
    const TARGET = 15;
    const gridEl = document.getElementById('grid');

    // Generate 3x3 inputs
    for (let i = 0; i < N * N; i++) {
      const input = document.createElement('input');
      input.type = 'number';
      input.className = 'cell';
      input.min = '1';
      input.max = '9';
      input.id = `c_${i}`;
      input.addEventListener('input', checkBoard);
      gridEl.appendChild(input);
    }

    function getValues() {
      const vals = [];
      for (let i = 0; i < N * N; i++) {
        const val = parseInt(document.getElementById(`c_${i}`).value, 10);
        vals.push(isNaN(val) ? 0 : val);
      }
      return vals;
    }

    function checkBoard() {
      const b = getValues();
      let validRows = 0, validCols = 0, validDiags = 0;

      // Rows
      for (let r = 0; r < 3; r++) {
        if (b[r*3] + b[r*3+1] + b[r*3+2] === TARGET) validRows++;
      }
      // Cols
      for (let c = 0; c < 3; c++) {
        if (b[c] + b[c+3] + b[c+6] === TARGET) validCols++;
      }
      // Diagonals
      if (b[0] + b[4] + b[8] === TARGET) validDiags++;
      if (b[2] + b[4] + b[6] === TARGET) validDiags++;

      updateIndicator('row-status', `Rows: ${validRows}/3`, validRows === 3);
      updateIndicator('col-status', `Cols: ${validCols}/3`, validCols === 3);
      updateIndicator('diag-status', `Diags: ${validDiags}/2`, validDiags === 2);

      // Check unique 1 to 9
      const unique = new Set(b.filter(v => v >= 1 && v <= 9));
      if (validRows === 3 && validCols === 3 && validDiags === 2 && unique.size === 9) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        setTimeout(() => alert('🎉 Solved successfully!'), 50);
      }
    }

    function updateIndicator(id, text, isValid) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.classList.toggle('valid', isValid);
    }

    function resetBoard() {
      for (let i = 0; i < 9; i++) document.getElementById(`c_${i}`).value = '';
      checkBoard();
    }

    function autoSolve() {
      // Standard Siamese 3x3 Magic Square solution
      const solution = [8, 1, 6, 3, 5, 7, 4, 9, 2];
      solution.forEach((v, idx) => {
        document.getElementById(`c_${idx}`).value = v;
      });
      checkBoard();
    }
  </script>
</body>
</html>
