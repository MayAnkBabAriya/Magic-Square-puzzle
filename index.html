<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magic Square Puzzle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 10px 8px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0f131a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    .game-card {
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      width: 100%;
      max-width: 360px;
    }

    /* Player Profile Bar */
    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #12161f;
      padding: 6px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
    }

    .player-edit-btn {
      background: #252d3d;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Stats & Timer Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
      gap: 4px;
    }

    .stat-pill {
      flex: 1;
      background: #12161f;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-pill .lbl {
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.3px;
    }

    .stat-pill .val {
      font-size: 12px;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
      text-align: center;
    }

    .stat-pill.timer-box .val {
      color: #4ade80;
    }

    /* Switch Groups */
    .switch-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      width: 100%;
      max-width: 320px;
    }

    .pill-switch {
      flex: 1;
      display: flex;
      background: #12161f;
      padding: 3px;
      border-radius: 12px;
      gap: 3px;
    }

    .toggle-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .toggle-btn.active {
      background: #252d3d;
      color: #38bdf8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .toggle-btn.active.auto-mode {
      color: #4ade80;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
      margin-bottom: 8px;
    }

    .title-tag {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }

    .target-pill {
      background: #142e1d;
      border: 1.5px solid #22c55e;
      color: #22c55e;
      font-size: 14px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.25);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .target-pill span {
      color: #86efac;
      font-size: 11px;
      font-weight: 600;
    }

    .board-layout {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }

    .row-align {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .grid {
      display: grid;
      grid-gap: 5px;
      background: #12161f;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .grid.grid-3 {
      grid-template-columns: repeat(3, 56px);
    }
    .grid.grid-3 .cell {
      width: 56px;
      height: 56px;
      font-size: 24px;
    }

    .grid.grid-5 {
      grid-template-columns: repeat(5, 44px);
    }
    .grid.grid-5 .cell {
      width: 44px;
      height: 44px;
      font-size: 18px;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #2d3748;
      border-radius: 8px;
      background: #252d3d;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cell.selected {
      background: #2b3547;
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.45);
    }

    .sum-box {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      background: #252d3d;
      color: #718096;
      transition: all 0.2s ease;
    }

    .sum-box.matched {
      background: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }

    .row-sums {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .grid-3-parent .row-sums .sum-box { width: 44px; height: 56px; font-size: 17px; }
    .grid-3-parent .col-sums .sum-box { width: 56px; height: 42px; font-size: 17px; }
    .grid-3-parent .corner-diag { width: 44px; height: 42px; font-size: 17px; }

    .grid-5-parent .row-sums .sum-box { width: 38px; height: 44px; font-size: 13px; }
    .grid-5-parent .col-sums .sum-box { width: 44px; height: 34px; font-size: 13px; }
    .grid-5-parent .corner-diag { width: 38px; height: 34px; font-size: 13px; }

    .col-sums {
      display: flex;
      gap: 5px;
      margin-left: 5px;
    }

    .hint-container {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .hint-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .num-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 340px;
    }

    .num-chip {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: #252d3d;
      border: 1.5px solid #3b475d;
      color: #38bdf8;
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .num-chip:active {
      transform: scale(0.93);
      background: #334155;
    }

    .num-chip.used {
      background: rgba(37, 45, 61, 0.3);
      border-color: transparent;
      color: #4b5563;
      text-decoration: line-through;
      pointer-events: none;
    }

    .num-chip.next-auto {
      border-color: #22c55e;
      color: #86efac;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
    }

    button.btn-ctrl {
      flex: 1;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      border: none;
    }

    .btn-reset {
      background: #252d3d;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-reset:active { background: #2f394d; }

    .btn-clear {
      background: #3f1d24;
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    .btn-clear:active { background: #4c1d27; }

    .btn-auto {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
    }
    .btn-auto:active { transform: translateY(1px); }

    /* Name Entry Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-card {
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: #ffffff;
    }

    .modal-input {
      width: 100%;
      background: #12161f;
      border: 1.5px solid #3b475d;
      border-radius: 10px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      padding: 10px 12px;
      text-align: center;
      outline: none;
    }

    .modal-input:focus {
      border-color: #38bdf8;
    }

    .modal-btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px 0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Name Entry Prompt Modal -->
  <div class="modal-backdrop" id="nameModal">
    <div class="modal-card">
      <div class="modal-title">Enter Your Name</div>
      <input type="text" class="modal-input" id="playerNameInput" placeholder="Player Name" maxlength="15" autocomplete="off">
      <button class="modal-btn" onclick="savePlayerName()">Start Game</button>
    </div>
  </div>

  <div class="game-card">
    <!-- Active Player Header -->
    <div class="player-bar">
      <div class="player-info">
        <span>👤</span>
        <span id="playerDisplay">Guest</span>
      </div>
      <button class="player-edit-btn" onclick="openNameModal()">Change</button>
    </div>

    <!-- Live Timer & Saved Record Dashboard -->
    <div class="stats-bar">
      <div class="stat-pill timer-box">
        <span class="lbl">TIMER</span>
        <span class="val" id="timeDisplay">00:00</span>
      </div>
      <div class="stat-pill">
        <span class="lbl">YOUR BEST</span>
        <span class="val" id="userBestDisplay">--:--</span>
      </div>
      <div class="stat-pill">
        <span class="lbl">OVERALL BEST</span>
        <span class="val" id="overallBestDisplay">--:--</span>
      </div>
    </div>

    <!-- Switchers -->
    <div class="switch-group">
      <div class="pill-switch">
        <button class="toggle-btn" id="btn-size-3" onclick="switchGridSize(3)">3 × 3</button>
        <button class="toggle-btn active" id="btn-size-5" onclick="switchGridSize(5)">5 × 5</button>
      </div>

      <div class="pill-switch">
        <button class="toggle-btn active" id="btn-mode-manual" onclick="setInputMode('manual')">Manual</button>
        <button class="toggle-btn auto-mode" id="btn-mode-auto" onclick="setInputMode('auto')">Auto Place</button>
      </div>
    </div>

    <!-- Target Sum Pill -->
    <div class="header-bar">
      <div class="title-tag" id="mode-title">5 × 5 GRID</div>
      <div class="target-pill">
        <span>SUM</span> <span id="target-val">65</span>
      </div>
    </div>

    <!-- Board Layout -->
    <div class="board-layout grid-5-parent" id="board-container">
      <div class="row-align">
        <div class="grid grid-5" id="grid"></div>
        <div class="row-sums" id="row-sums"></div>
      </div>

      <div class="row-align">
        <div class="col-sums" id="col-sums"></div>
        <div class="sum-box corner-diag" id="diag0">0</div>
      </div>
    </div>

    <!-- Number Selection Panel -->
    <div class="hint-container">
      <div class="hint-label" id="palette-label">TAP NUMBER (1 - 25):</div>
      <div class="num-palette" id="num-palette"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn-ctrl btn-clear" onclick="clearSelected()">Erase</button>
      <button class="btn-ctrl btn-reset" onclick="resetAll()">Reset</button>
      <button class="btn-ctrl btn-auto" id="btn-auto-solve" onclick="autoSolve()">Auto Solve</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Direct Firebase Realtime Database URL
    const FIREBASE_DB_URL = "https://magic-square-puzzle-default-rtdb.asia-southeast1.firebasedatabase.app";

    let N = 5;
    let TARGET = 65;
    let inputMode = 'manual';
    let cells = [];
    let chips = [];
    let activeIdx = 0;

    // Timer & Record State
    let currentPlayer = 'Guest';
    let timerInterval = null;
    let timerRunning = false;
    let timerStartTime = 0;
    let elapsedSeconds = 0;

    function formatTime(totalSeconds) {
      if (totalSeconds === null || totalSeconds === undefined || totalSeconds === Infinity) return '--:--';
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimerIfNeeded() {
      if (!timerRunning) {
        timerRunning = true;
        timerStartTime = Date.now() - (elapsedSeconds * 1000);
        timerInterval = setInterval(() => {
          elapsedSeconds = Math.floor((Date.now() - timerStartTime) / 1000);
          document.getElementById('timeDisplay').textContent = formatTime(elapsedSeconds);
        }, 1000);
      }
    }

    function stopTimer() {
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
      }
    }

    function resetTimer() {
      stopTimer();
      elapsedSeconds = 0;
      document.getElementById('timeDisplay').textContent = '00:00';
    }

    // Sanitize username for Firebase paths
    function sanitizeKey(key) {
      return encodeURIComponent(key).replace(/\./g, '%2E');
    }

    // Live Database Sync via Firebase REST API
    async function loadCloudRecords() {
      try {
        const modeKey = `${N}x${N}`;
        const res = await fetch(`${FIREBASE_DB_URL}/records/${modeKey}.json`);
        const modeData = await res.json() || { overallBest: null, players: {} };

        // 1. Personal Best Display
        const cleanPlayerKey = sanitizeKey(currentPlayer);
        const userBest = modeData.players ? modeData.players[cleanPlayerKey] : null;
        document.getElementById('userBestDisplay').textContent = 
          (userBest !== undefined && userBest !== null) ? formatTime(userBest) : '--:--';

        // 2. Global Overall Best Display
        if (modeData.overallBest && modeData.overallBest.time) {
          document.getElementById('overallBestDisplay').textContent = 
            `${formatTime(modeData.overallBest.time)} (${modeData.overallBest.player})`;
        } else {
          document.getElementById('overallBestDisplay').textContent = '--:--';
        }
      } catch (e) {
        console.warn("Could not sync with Firebase, checking local backup.", e);
      }
    }

    async function saveRecord(seconds) {
      const modeKey = `${N}x${N}`;
      const cleanPlayerKey = sanitizeKey(currentPlayer);

      try {
        // Fetch current records to check before overwriting
        const res = await fetch(`${FIREBASE_DB_URL}/records/${modeKey}.json`);
        let modeData = await res.json() || {};
        if (!modeData.players) modeData.players = {};

        // Update Personal Best
        const oldPersonal = modeData.players[cleanPlayerKey];
        if (!oldPersonal || seconds < oldPersonal) {
          await fetch(`${FIREBASE_DB_URL}/records/${modeKey}/players/${cleanPlayerKey}.json`, {
            method: 'PUT',
            body: JSON.stringify(seconds)
          });
        }

        // Update Overall Best
        if (!modeData.overallBest || seconds < modeData.overallBest.time) {
          await fetch(`${FIREBASE_DB_URL}/records/${modeKey}/overallBest.json`, {
            method: 'PUT',
            body: JSON.stringify({ player: currentPlayer, time: seconds })
          });
        }

        loadCloudRecords();
      } catch (e) {
        console.error("Failed to push score to Firebase:", e);
      }
    }

    function openNameModal() {
      document.getElementById('playerNameInput').value = currentPlayer !== 'Guest' ? currentPlayer : '';
      document.getElementById('nameModal').style.display = 'flex';
      setTimeout(() => document.getElementById('playerNameInput').focus(), 150);
    }

    function savePlayerName() {
      const input = document.getElementById('playerNameInput').value.trim();
      currentPlayer = input.length > 0 ? input : 'Guest';
      localStorage.setItem('magic_square_current_player', currentPlayer);
      document.getElementById('playerDisplay').textContent = currentPlayer;
      document.getElementById('nameModal').style.display = 'none';
      loadCloudRecords();
    }

    function loadInitialPlayer() {
      const saved = localStorage.getItem('magic_square_current_player');
      if (saved) {
        currentPlayer = saved;
        document.getElementById('playerDisplay').textContent = currentPlayer;
        document.getElementById('nameModal').style.display = 'none';
        loadCloudRecords();
      } else {
        openNameModal();
      }
    }

    function generateMagicSquare(n) {
      const square = Array.from({ length: n }, () => Array(n).fill(0));
      let r = 0;
      let c = Math.floor(n / 2);

      for (let num = 1; num <= n * n; num++) {
        square[r][c] = num;
        let nextR = (r - 1 + n) % n;
        let nextC = (c + 1) % n;

        if (square[nextR][nextC] !== 0) {
          r = (r + 1) % n;
        } else {
          r = nextR;
          c = nextC;
        }
      }
      return square.flat();
    }

    function selectCell(idx) {
      activeIdx = idx;
      cells.forEach((cell, i) => {
        cell.classList.toggle('selected', i === idx);
      });
    }

    function getNextPendingNumber() {
      const v = getValues();
      const usedSet = new Set(v.filter(n => n >= 1 && n <= N * N));
      for (let num = 1; num <= N * N; num++) {
        if (!usedSet.has(num)) return num;
      }
      return null;
    }

    function setInputMode(mode) {
      inputMode = mode;
      document.getElementById('btn-mode-manual').classList.toggle('active', mode === 'manual');
      document.getElementById('btn-mode-auto').classList.toggle('active', mode === 'auto');
      updatePaletteLabel();
      recalculate();
    }

    function updatePaletteLabel() {
      const label = document.getElementById('palette-label');
      if (inputMode === 'auto') {
        const nextNum = getNextPendingNumber();
        label.textContent = nextNum ? `AUTO NEXT: ${nextNum} (TAP ANY BOX)` : 'ALL NUMBERS PLACED';
      } else {
        label.textContent = `MANUAL: TAP NUMBER (1 - ${N * N})`;
      }
    }

    function initBoard() {
      const gridEl = document.getElementById('grid');
      const rowSumsEl = document.getElementById('row-sums');
      const colSumsEl = document.getElementById('col-sums');
      const paletteEl = document.getElementById('num-palette');
      const boardContainer = document.getElementById('board-container');

      gridEl.innerHTML = '';
      rowSumsEl.innerHTML = '';
      colSumsEl.innerHTML = '';
      paletteEl.innerHTML = '';

      TARGET = N === 3 ? 15 : 65;
      document.getElementById('target-val').textContent = TARGET;
      document.getElementById('mode-title').textContent = `${N} × ${N} GRID`;
      document.getElementById('btn-auto-solve').textContent = `Auto ${TARGET}`;

      boardContainer.className = `board-layout grid-${N}-parent`;
      gridEl.className = `grid grid-${N}`;

      cells = [];
      for (let i = 0; i < N * N; i++) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.id = `c${i}`;
        div.textContent = '';

        div.addEventListener('click', () => {
          if (inputMode === 'auto') {
            selectCell(i);
            if (div.textContent !== '') {
              div.textContent = '';
              if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
              recalculate();
            } else {
              const nextNum = getNextPendingNumber();
              if (nextNum !== null) {
                startTimerIfNeeded();
                div.textContent = nextNum.toString();
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                recalculate();
              }
            }
          } else {
            if (activeIdx === i && div.textContent !== '') {
              clearSelected();
            } else {
              selectCell(i);
            }
          }
        });

        gridEl.appendChild(div);
        cells.push(div);
      }

      for (let i = 0; i < N; i++) {
        const rBox = document.createElement('div');
        rBox.className = 'sum-box';
        rBox.id = `row${i}`;
        rBox.textContent = '0';
        rowSumsEl.appendChild(rBox);

        const cBox = document.createElement('div');
        cBox.className = 'sum-box';
        cBox.id = `col${i}`;
        cBox.textContent = '0';
        colSumsEl.appendChild(cBox);
      }

      chips = [];
      for (let num = 1; num <= N * N; num++) {
        const chip = document.createElement('div');
        chip.className = 'num-chip';
        chip.setAttribute('data-num', num);
        chip.textContent = num;
        paletteEl.appendChild(chip);
        chips.push(chip);

        chip.addEventListener('click', () => {
          placeNumber(num);
        });
      }

      selectCell(0);
      resetTimer();
      loadCloudRecords();
      recalculate();
    }

    function switchGridSize(newN) {
      if (N === newN) return;
      N = newN;
      document.getElementById('btn-size-3').classList.toggle('active', N === 3);
      document.getElementById('btn-size-5').classList.toggle('active', N === 5);
      initBoard();
    }

    function findNextEmptyCell(currentIdx) {
      for (let offset = 1; offset <= N * N; offset++) {
        const next = (currentIdx + offset) % (N * N);
        if (!cells[next].textContent) return next;
      }
      return -1;
    }

    function placeNumber(num) {
      startTimerIfNeeded();
      const valStr = num.toString();

      cells.forEach(c => {
        if (c.textContent === valStr) {
          c.textContent = '';
        }
      });

      cells[activeIdx].textContent = valStr;

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      recalculate();

      const nextEmpty = findNextEmptyCell(activeIdx);
      if (nextEmpty !== -1) {
        selectCell(nextEmpty);
      }
    }

    function clearSelected() {
      if (cells[activeIdx]) {
        cells[activeIdx].textContent = '';
        recalculate();
      }
    }

    function getValues() {
      return cells.map(c => parseInt(c.textContent, 10) || 0);
    }

    function setBoxState(id, sum) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = sum;
      if (sum === TARGET) {
        el.classList.add('matched');
      } else {
        el.classList.remove('matched');
      }
    }

    function recalculate() {
      const v = getValues();
      let allRowsCorrect = true;
      let allColsCorrect = true;

      for (let r = 0; r < N; r++) {
        let rSum = 0;
        for (let c = 0; c < N; c++) rSum += v[r * N + c];
        setBoxState(`row${r}`, rSum);
        if (rSum !== TARGET) allRowsCorrect = false;
      }

      for (let c = 0; c < N; c++) {
        let cSum = 0;
        for (let r = 0; r < N; r++) cSum += v[r * N + c];
        setBoxState(`col${c}`, cSum);
        if (cSum !== TARGET) allColsCorrect = false;
      }

      let d0 = 0;
      for (let i = 0; i < N; i++) d0 += v[i * N + i];
      setBoxState('diag0', d0);

      let d1 = 0;
      for (let i = 0; i < N; i++) d1 += v[i * N + (N - 1 - i)];

      const usedSet = new Set(v.filter(n => n >= 1 && n <= N * N));
      const nextPending = getNextPendingNumber();

      chips.forEach(chip => {
        const num = parseInt(chip.getAttribute('data-num'), 10);
        chip.classList.remove('next-auto');
        if (usedSet.has(num)) {
          chip.classList.add('used');
        } else {
          chip.classList.remove('used');
          if (inputMode === 'auto' && num === nextPending) {
            chip.classList.add('next-auto');
          }
        }
      });

      updatePaletteLabel();

      // Win Condition
      if (usedSet.size === N * N && allRowsCorrect && allColsCorrect && d0 === TARGET && d1 === TARGET) {
        stopTimer();
        const finishTime = elapsedSeconds;
        saveRecord(finishTime);

        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }

        setTimeout(() => {
          alert(`🎉 Outstanding, ${currentPlayer}!\nYou completed the ${N}x${N} puzzle in ${formatTime(finishTime)}!`);
        }, 80);
      }
    }

    function resetAll() {
      cells.forEach(c => c.textContent = '');
      resetTimer();
      recalculate();
      selectCell(0);
    }

    function autoSolve() {
      stopTimer();
      const solution = generateMagicSquare(N);
      solution.forEach((val, i) => {
        if (cells[i]) cells[i].textContent = val;
      });
      recalculate();
    }

    // Startup
    initBoard();
    loadInitialPlayer();
  </script>
</body>
