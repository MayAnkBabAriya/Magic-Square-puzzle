<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magic Square Puzzle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 10px 8px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #0f131a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    .game-card {
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      width: 100%;
      max-width: 360px;
    }

    /* Mode switcher */
    .mode-switch {
      display: flex;
      background: #12161f;
      padding: 3px;
      border-radius: 12px;
      gap: 4px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 220px;
    }

    .mode-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #252d3d;
      color: #38bdf8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
      margin-bottom: 12px;
    }

    .title-tag {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }

    .target-pill {
      background: #142e1d;
      border: 1.5px solid #22c55e;
      color: #22c55e;
      font-size: 15px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.25);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .target-pill span {
      color: #86efac;
      font-size: 11px;
      font-weight: 600;
    }

    .board-layout {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }

    .row-align {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .grid {
      display: grid;
      grid-gap: 5px;
      background: #12161f;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Dynamic sizing for 3x3 and 5x5 */
    .grid.grid-3 {
      grid-template-columns: repeat(3, 54px);
    }
    .grid.grid-3 .cell {
      width: 54px;
      height: 54px;
      font-size: 24px;
    }

    .grid.grid-5 {
      grid-template-columns: repeat(5, 42px);
    }
    .grid.grid-5 .cell {
      width: 42px;
      height: 42px;
      font-size: 17px;
    }

    .cell {
      border: 1.5px solid #2d3748;
      border-radius: 8px;
      background: #252d3d;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      outline: none;
      caret-color: #22c55e;
      padding: 0;
      transition: all 0.15s ease;
    }

    .cell:focus {
      background: #2b3547;
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.35);
    }

    .sum-box {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      border-radius: 8px;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      background: #252d3d;
      color: #718096;
      transition: all 0.2s ease;
    }

    .sum-box.matched {
      background: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }

    .row-sums {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .grid-3-parent .row-sums .sum-box { width: 44px; height: 54px; font-size: 17px; }
    .grid-3-parent .col-sums .sum-box { width: 54px; height: 42px; font-size: 17px; }
    .grid-3-parent .corner-diag { width: 44px; height: 42px; font-size: 17px; }

    .grid-5-parent .row-sums .sum-box { width: 36px; height: 42px; font-size: 13px; }
    .grid-5-parent .col-sums .sum-box { width: 42px; height: 34px; font-size: 13px; }
    .grid-5-parent .corner-diag { width: 36px; height: 34px; font-size: 13px; }

    .col-sums {
      display: flex;
      gap: 5px;
      margin-left: 5px;
    }

    /* Numbers Tracker Palette */
    .hint-container {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .hint-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.3px;
    }

    .num-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      max-width: 320px;
    }

    .num-chip {
      width: 27px;
      height: 27px;
      border-radius: 6px;
      background: #252d3d;
      border: 1px solid #3b475d;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .num-chip.used {
      background: transparent;
      border-color: transparent;
      color: #4b5563;
      text-decoration: line-through;
      pointer-events: none;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      width: 100%;
    }

    button.btn-ctrl {
      flex: 1;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
    }

    .btn-reset {
      background: #252d3d;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-reset:active { background: #2f394d; }

    .btn-auto {
      background: #16a34a;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
    }
    .btn-auto:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- Mode Switcher -->
    <div class="mode-switch">
      <button class="mode-btn" id="btn-mode-3" onclick="switchMode(3)">3 × 3 (15)</button>
      <button class="mode-btn active" id="btn-mode-5" onclick="switchMode(5)">5 × 5 (65)</button>
    </div>

    <!-- Target Display -->
    <div class="header-bar">
      <div class="title-tag" id="mode-title">5 × 5 GRID</div>
      <div class="target-pill">
        <span>SUM</span> <span id="target-val">65</span>
      </div>
    </div>

    <!-- Board Layout Container -->
    <div class="board-layout grid-5-parent" id="board-container">
      <div class="row-align">
        <div class="grid grid-5" id="grid"></div>
        <div class="row-sums" id="row-sums"></div>
      </div>

      <div class="row-align">
        <div class="col-sums" id="col-sums"></div>
        <div class="sum-box corner-diag" id="diag0">0</div>
      </div>
    </div>

    <!-- Available Numbers Tracker -->
    <div class="hint-container">
      <div class="hint-label" id="palette-label">AVAILABLE (1 - 25):</div>
      <div class="num-palette" id="num-palette"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn-ctrl btn-reset" onclick="resetAll()">Reset</button>
      <button class="btn-ctrl btn-auto" id="btn-auto-solve" onclick="autoSolve()">Auto Solve</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let N = 5; // Default starts at 5x5 as requested
    let TARGET = 65;
    let cells = [];
    let chips = [];
    let activeIdx = 0;

    // Siamese Method to generate standard magic squares for odd N (3 and 5)
    function generateMagicSquare(n) {
      const square = Array.from({ length: n }, () => Array(n).fill(0));
      let r = 0;
      let c = Math.floor(n / 2);

      for (let num = 1; num <= n * n; num++) {
        square[r][c] = num;
        let nextR = (r - 1 + n) % n;
        let nextC = (c + 1) % n;

        if (square[nextR][nextC] !== 0) {
          r = (r + 1) % n;
        } else {
          r = nextR;
          c = nextC;
        }
      }
      return square.flat();
    }

    function initBoard() {
      const gridEl = document.getElementById('grid');
      const rowSumsEl = document.getElementById('row-sums');
      const colSumsEl = document.getElementById('col-sums');
      const paletteEl = document.getElementById('num-palette');
      const boardContainer = document.getElementById('board-container');

      gridEl.innerHTML = '';
      rowSumsEl.innerHTML = '';
      colSumsEl.innerHTML = '';
      paletteEl.innerHTML = '';

      TARGET = N === 3 ? 15 : 65;
      document.getElementById('target-val').textContent = TARGET;
      document.getElementById('mode-title').textContent = `${N} × ${N} GRID`;
      document.getElementById('palette-label').textContent = `AVAILABLE (1 - ${N * N}):`;
      document.getElementById('btn-auto-solve').textContent = `Auto ${TARGET}`;

      boardContainer.className = `board-layout grid-${N}-parent`;
      gridEl.className = `grid grid-${N}`;

      // Create Grid Inputs
      cells = [];
      for (let i = 0; i < N * N; i++) {
        const input = document.createElement('input');
        input.className = 'cell';
        input.type = 'text';
        input.inputMode = 'numeric';
        input.id = `c${i}`;
        gridEl.appendChild(input);
        cells.push(input);
      }

      // Create Row and Column Sum indicators
      for (let i = 0; i < N; i++) {
        const rBox = document.createElement('div');
        rBox.className = 'sum-box';
        rBox.id = `row${i}`;
        rBox.textContent = '0';
        rowSumsEl.appendChild(rBox);

        const cBox = document.createElement('div');
        cBox.className = 'sum-box';
        cBox.id = `col${i}`;
        cBox.textContent = '0';
        colSumsEl.appendChild(cBox);
      }

      // Create Number Palette Chips
      chips = [];
      for (let num = 1; num <= N * N; num++) {
        const chip = document.createElement('div');
        chip.className = 'num-chip';
        chip.setAttribute('data-num', num);
        chip.textContent = num;
        paletteEl.appendChild(chip);
        chips.push(chip);

        chip.addEventListener('click', () => {
          const targetCellIdx = cells[activeIdx].value
            ? (findNextEmptyCell(activeIdx) !== -1 ? findNextEmptyCell(activeIdx) : activeIdx)
            : activeIdx;
          handleDigit(targetCellIdx, num.toString());
        });
      }

      // Attach cell events
      activeIdx = 0;
      cells.forEach((cell, idx) => {
        cell.addEventListener('focus', () => {
          activeIdx = idx;
          setTimeout(() => cell.select(), 10);
        });

        cell.addEventListener('input', (e) => {
          handleDigit(idx, e.target.value);
        });

        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !cell.value) {
            e.preventDefault();
            findPreviousCell(idx);
          }
        });
      });

      recalculate();
    }

    function switchMode(newN) {
      if (N === newN) return;
      N = newN;
      document.getElementById('btn-mode-3').classList.toggle('active', N === 3);
      document.getElementById('btn-mode-5').classList.toggle('active', N === 5);
      initBoard();
    }

    function findNextEmptyCell(currentIdx) {
      for (let offset = 1; offset <= N * N; offset++) {
        const next = (currentIdx + offset) % (N * N);
        if (!cells[next].value) return next;
      }
      return -1;
    }

    function findPreviousCell(currentIdx) {
      const prev = (currentIdx - 1 + (N * N)) % (N * N);
      cells[prev].focus();
      cells[prev].value = '';
      recalculate();
    }

    function handleDigit(idx, rawVal) {
      const maxNum = N * N;
      const numVal = parseInt(rawVal.replace(/\D/g, ''), 10);

      if (!numVal || numVal < 1 || numVal > maxNum) {
        cells[idx].value = '';
        recalculate();
        return;
      }

      const valStr = numVal.toString();

      // Clear duplicate entry elsewhere
      cells.forEach((c, i) => {
        if (i !== idx && c.value === valStr) {
          c.value = '';
        }
      });

      cells[idx].value = valStr;
      recalculate();

      // Auto-jump to next open slot
      const nextEmpty = findNextEmptyCell(idx);
      if (nextEmpty !== -1) {
        cells[nextEmpty].focus();
        cells[nextEmpty].select();
      }
    }

    function getValues() {
      return cells.map(c => parseInt(c.value, 10) || 0);
    }

    function setBoxState(id, sum) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = sum;
      if (sum === TARGET) {
        el.classList.add('matched');
      } else {
        el.classList.remove('matched');
      }
    }

    function recalculate() {
      const v = getValues();
      let allRowsCorrect = true;
      let allColsCorrect = true;

      // Check Rows
      for (let r = 0; r < N; r++) {
        let rSum = 0;
        for (let c = 0; c < N; c++) rSum += v[r * N + c];
        setBoxState(`row${r}`, rSum);
        if (rSum !== TARGET) allRowsCorrect = false;
      }

      // Check Columns
      for (let c = 0; c < N; c++) {
        let cSum = 0;
        for (let r = 0; r < N; r++) cSum += v[r * N + c];
        setBoxState(`col${c}`, cSum);
        if (cSum !== TARGET) allColsCorrect = false;
      }

      // Main Diagonal (\)
      let d0 = 0;
      for (let i = 0; i < N; i++) d0 += v[i * N + i];
      setBoxState('diag0', d0);

      // Anti-Diagonal (/)
      let d1 = 0;
      for (let i = 0; i < N; i++) d1 += v[i * N + (N - 1 - i)];

      // Chip status update
      const usedSet = new Set(v.filter(n => n >= 1 && n <= N * N));
      chips.forEach(chip => {
        const num = parseInt(chip.getAttribute('data-num'), 10);
        if (usedSet.has(num)) {
          chip.classList.add('used');
        } else {
          chip.classList.remove('used');
        }
      });

      // Win condition trigger
      if (usedSet.size === N * N && allRowsCorrect && allColsCorrect && d0 === TARGET && d1 === TARGET) {
        if (tg?.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred('success');
        }
        setTimeout(() => alert(`🎉 Congratulations! You solved the ${TARGET} Magic Square!`), 80);
      }
    }

    function resetAll() {
      cells.forEach(c => c.value = '');
      recalculate();
      if (cells[0]) cells[0].focus();
    }

    function autoSolve() {
      const solution = generateMagicSquare(N);
      solution.forEach((val, i) => {
        if (cells[i]) cells[i].value = val;
      });
      recalculate();
    }

    // Launch initial board (5x5, 65 target)
    initBoard();
  </script>
</body>
</html>
