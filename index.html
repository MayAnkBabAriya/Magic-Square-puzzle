<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Magic Square Puzzle</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: calc(6px + env(safe-area-inset-top, 0px)) 
               calc(8px + env(safe-area-inset-right, 0px)) 
               calc(6px + env(safe-area-inset-bottom, 0px)) 
               calc(8px + env(safe-area-inset-left, 0px));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f131a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* Main Container: Automatically adapts between Portrait and Landscape */
    .game-card {
      background: #1a202c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column; /* Default portrait */
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
      width: 100%;
      max-width: 360px;
      transition: all 0.25s ease;
    }

    /* Landscape mode switch */
    @media (orientation: landscape), (min-width: 550px) {
      .game-card {
        flex-direction: row;
        max-width: 600px;
        gap: 18px;
        padding: 12px 18px;
      }

      .controls-side {
        width: 220px !important;
        margin-top: 0 !important;
      }
    }

    /* Left Side: Game Board */
    .board-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .row-align {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(48px, 56px));
      grid-gap: 5px;
      background: #12161f;
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1.5px solid #2d3748;
      border-radius: 9px;
      background: #252d3d;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      color: #ffffff;
      outline: none;
      caret-color: #22c55e;
      padding: 0;
      transition: all 0.15s ease;
    }

    .cell:focus {
      background: #2b3547;
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.35);
    }

    .sum-box {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 800;
      border-radius: 9px;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      background: #252d3d;
      color: #718096;
      transition: all 0.2s ease;
    }

    .sum-box.matched {
      background: #16a34a;
      border-color: #4ade80;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.45);
    }

    .row-sums {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .row-sums .sum-box {
      width: 44px;
      height: 52px;
    }

    .col-sums {
      display: flex;
      gap: 5px;
      margin-left: 5px;
    }
    .col-sums .sum-box {
      width: 52px;
      height: 42px;
    }

    .corner-diag {
      width: 44px;
      height: 42px;
    }

    /* Controls & Numbers */
    .controls-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-top: 10px;
      gap: 10px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .title-tag {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }

    .target-pill {
      background: #142e1d;
      border: 1.5px solid #22c55e;
      color: #22c55e;
      font-size: 14px;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .target-pill span {
      color: #86efac;
      font-size: 10px;
      font-weight: 600;
    }

    .hint-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .hint-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    .num-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      max-width: 220px;
    }

    .num-chip {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: #252d3d;
      border: 1px solid #3b475d;
      color: #38bdf8;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .num-chip.used {
      background: transparent;
      border-color: transparent;
      color: #4b5563;
      text-decoration: line-through;
      pointer-events: none;
    }

    .controls {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      outline: none;
    }

    .btn-reset {
      background: #252d3d;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-reset:active {
      background: #2f394d;
    }

    .btn-auto {
      background: #16a34a;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.35);
    }
    .btn-auto:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- Left Column: Grid and Sum boxes -->
    <div class="board-side">
      <div class="row-align">
        <div class="grid" id="grid">
          <input class="cell" type="text" inputmode="numeric" id="c0">
          <input class="cell" type="text" inputmode="numeric" id="c1">
          <input class="cell" type="text" inputmode="numeric" id="c2">
          <input class="cell" type="text" inputmode="numeric" id="c3">
          <input class="cell" type="text" inputmode="numeric" id="c4">
          <input class="cell" type="text" inputmode="numeric" id="c5">
          <input class="cell" type="text" inputmode="numeric" id="c6">
          <input class="cell" type="text" inputmode="numeric" id="c7">
          <input class="cell" type="text" inputmode="numeric" id="c8">
        </div>

        <div class="row-sums">
          <div class="sum-box" id="row0">0</div>
          <div class="sum-box" id="row1">0</div>
          <div class="sum-box" id="row2">0</div>
        </div>
      </div>

      <div class="row-align">
        <div class="col-sums">
          <div class="sum-box" id="col0">0</div>
          <div class="sum-box" id="col1">0</div>
          <div class="sum-box" id="col2">0</div>
        </div>
        <div class="sum-box corner-diag" id="diag0">0</div>
      </div>
    </div>

    <!-- Right Column: Info, Palette, & Controls -->
    <div class="controls-side">
      <div class="header-bar">
        <div class="title-tag">MAGIC SQUARE</div>
        <div class="target-pill">
          <span>SUM</span> 15
        </div>
      </div>

      <div class="hint-container">
        <div class="hint-label">TAP TO PLACE:</div>
        <div class="num-palette">
          <div class="num-chip" data-num="1">1</div>
          <div class="num-chip" data-num="2">2</div>
          <div class="num-chip" data-num="3">3</div>
          <div class="num-chip" data-num="4">4</div>
          <div class="num-chip" data-num="5">5</div>
          <div class="num-chip" data-num="6">6</div>
          <div class="num-chip" data-num="7">7</div>
          <div class="num-chip" data-num="8">8</div>
          <div class="num-chip" data-num="9">9</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-reset" onclick="resetAll()">Reset</button>
        <button class="btn-auto" onclick="autoSolve()">Auto 15</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    function initTelegram() {
      if (!tg) return;

      tg.ready();
      tg.expand();

      // Prevent accidental pull-down to close
      if (typeof tg.disableVerticalSwipes === 'function') {
        tg.disableVerticalSwipes();
      }

      // Allow free orientation rotating based on device sensor
      if (typeof tg.unlockOrientation === 'function') {
        tg.unlockOrientation();
      }
    }

    initTelegram();

    // Re-request fullscreen on first user touch gesture
    document.addEventListener('pointerdown', () => {
      if (tg && typeof tg.requestFullscreen === 'function' && !tg.isFullscreen) {
        tg.requestFullscreen();
      }
    }, { once: true });

    function triggerHaptic(type = 'impact', style = 'light') {
      if (!tg?.HapticFeedback) return;
      try {
        if (type === 'impact') tg.HapticFeedback.impactOccurred(style);
        else if (type === 'notification') tg.HapticFeedback.notificationOccurred(style);
        else if (type === 'selection') tg.HapticFeedback.selectionChanged();
      } catch (err) {}
    }

    const TARGET = 15;
    const cells = Array.from({ length: 9 }, (_, i) => document.getElementById(`c${i}`));
    const chips = Array.from(document.querySelectorAll('.num-chip'));
    let activeIdx = 0;

    cells.forEach((cell, idx) => {
      cell.addEventListener('focus', () => {
        activeIdx = idx;
        triggerHaptic('selection');
        setTimeout(() => cell.select(), 10);
      });

      cell.addEventListener('input', (e) => {
        handleDigit(idx, e.target.value);
      });

      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value) {
          e.preventDefault();
          triggerHaptic('impact', 'medium');
          findPreviousEmptyOrFilled(idx);
        }
      });
    });

    function findNextEmptyCell(currentIdx) {
      for (let offset = 1; offset <= 9; offset++) {
        const next = (currentIdx + offset) % 9;
        if (!cells[next].value) return next;
      }
      return -1;
    }

    function findPreviousEmptyOrFilled(currentIdx) {
      const prev = (currentIdx - 1 + 9) % 9;
      cells[prev].focus();
      cells[prev].value = '';
      recalculate();
    }

    function handleDigit(idx, val) {
      const match = val.match(/[1-9]/g);
      if (!match || match.length === 0) {
        cells[idx].value = '';
        triggerHaptic('impact', 'light');
        recalculate();
        return;
      }

      const digit = match[match.length - 1];

      cells.forEach((otherCell, otherIdx) => {
        if (otherIdx !== idx && otherCell.value === digit) {
          otherCell.value = '';
        }
      });

      cells[idx].value = digit;
      triggerHaptic('impact', 'light');
      recalculate();

      const nextEmpty = findNextEmptyCell(idx);
      if (nextEmpty !== -1) {
        cells[nextEmpty].focus();
        cells[nextEmpty].select();
      }
    }

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const num = chip.getAttribute('data-num');
        const targetCellIdx = cells[activeIdx].value ? (findNextEmptyCell(activeIdx) !== -1 ? findNextEmptyCell(activeIdx) : activeIdx) : activeIdx;
        triggerHaptic('impact', 'light');
        handleDigit(targetCellIdx, num);
      });
    });

    function getValues() {
      return cells.map(c => parseInt(c.value, 10) || 0);
    }

    function setBoxState(id, sum) {
      const el = document.getElementById(id);
      el.textContent = sum;
      if (sum === TARGET) el.classList.add('matched');
      else el.classList.remove('matched');
    }

    function recalculate() {
      const v = getValues();

      const r0 = v[0] + v[1] + v[2];
      const r1 = v[3] + v[4] + v[5];
      const r2 = v[6] + v[7] + v[8];
      setBoxState('row0', r0);
      setBoxState('row1', r1);
      setBoxState('row2', r2);

      const c0 = v[0] + v[3] + v[6];
      const c1 = v[1] + v[4] + v[7];
      const c2 = v[2] + v[5] + v[8];
      setBoxState('col0', c0);
      setBoxState('col1', c1);
      setBoxState('col2', c2);

      const d0 = v[0] + v[4] + v[8];
      const d1 = v[2] + v[4] + v[6];
      setBoxState('diag0', d0);

      const usedSet = new Set(v.filter(n => n >= 1 && n <= 9));
      chips.forEach(chip => {
        const num = parseInt(chip.getAttribute('data-num'), 10);
        if (usedSet.has(num)) chip.classList.add('used');
        else chip.classList.remove('used');
      });

      if (usedSet.size === 9 &&
          r0 === 15 && r1 === 15 && r2 === 15 &&
          c0 === 15 && c1 === 15 && c2 === 15 &&
          d0 === 15 && d1 === 15) {
        triggerHaptic('notification', 'success');
        setTimeout(() => alert('🎉 Congratulations! You solved the 15 Magic Square!'), 100);
      }
    }

    function resetAll() {
      triggerHaptic('impact', 'medium');
      cells.forEach(c => c.value = '');
      recalculate();
      cells[0].focus();
    }

    function autoSolve() {
      triggerHaptic('notification', 'success');
      const solution = [8, 1, 6, 3, 5, 7, 4, 9, 2];
      solution.forEach((val, i) => cells[i].value = val);
      recalculate();
    }

    recalculate();
  </script>
</body>
</html>
